name: Build Launcher-OS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Latest CMake (4.3.2)
      run: |
        wget https://github.com/Kitware/CMake/releases/download/v4.3.2/cmake-4.3.2-linux-x86_64.tar.gz
        tar -xzf cmake-4.3.2-linux-x86_64.tar.gz
        echo "$GITHUB_WORKSPACE/cmake-4.3.2-linux-x86_64/bin" >> $GITHUB_PATH

    - name: Install Dependencies & Vulkan SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libvulkan-dev vulkan-tools

    # Switching generator to -G Ninja prevents the Unix Makefile flag parsing bug with giflib on CMake 4.x
    - name: Configure CMake
      run: cmake -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Latest CMake (4.3.2)
      shell: bash
      run: |
        curl -L -o cmake-windows.zip https://github.com/Kitware/CMake/releases/download/v4.3.2/cmake-4.3.2-windows-x86_64.zip
        unzip -q cmake-windows.zip
        echo "$GITHUB_WORKSPACE/cmake-4.3.2-windows-x86_64/bin" >> $GITHUB_PATH

    - name: Install Vulkan SDK via Chocolatey
      run: |
        choco install vulkan-sdk -y
        echo "VULKAN_SDK=C:\VulkanSDK" >> $GITHUB_ENV
        echo "C:\VulkanSDK\Bin" >> $GITHUB_PATH

    # Hardcoding the exact library paths ensures FindVulkan succeeds instantly on MSVC
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release `
          -DVulkan_INCLUDE_DIR="C:/VulkanSDK/Include" `
          -DVulkan_LIBRARY="C:/VulkanSDK/Lib/vulkan-1.lib"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release
