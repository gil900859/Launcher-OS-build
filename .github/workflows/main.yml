name: Build Launcher-OS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Direct binary installation bypasses APT package locks entirely
    - name: Install Latest CMake (4.x+)
      run: |
        wget https://github.com/Kitware/CMake/releases/download/v4.0.0-rc3/cmake-4.0.0-rc3-linux-x86_64.tar.gz
        tar -xzf cmake-4.0.0-rc3-linux-x86_64.tar.gz
        echo "$GITHUB_WORKSPACE/cmake-4.0.0-rc3-linux-x86_64/bin" >> $GITHUB_PATH

    - name: Install Dependencies & Vulkan SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libvulkan-dev vulkan-tools

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Chocolatey is pre-configured on GitHub runners and handles license approvals automatically
    - name: Install Vulkan SDK via Chocolatey
      run: |
        choco install vulkan-sdk -y
        echo "VULKAN_SDK=C:\VulkanSDK" >> $GITHUB_ENV
        echo "C:\VulkanSDK\Bin" >> $GITHUB_PATH

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release
