name: Build Launcher-OS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Use Kitware's official APT repository to get the absolute latest CMake (4.x+)
    - name: Install Latest CMake & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common lsb-release
        wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /etc/apt/trusted.gpg.d/kitware.gpg >/dev/null
        sudo apt-add-repository "deb https://apt.kitware.com/ubuntu/ $(lsb_release -cs) main"
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libvulkan-dev vulkan-tools

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Install official Vulkan SDK via Windows Package Manager (winget)
    - name: Install Vulkan SDK via Winget
      run: |
        winget install LunarG.VulkanSDK --accept-source-agreements --accept-package-agreements
        echo "VULKAN_SDK=C:\VulkanSDK" >> $GITHUB_ENV
        echo "C:\VulkanSDK\Bin" >> $GITHUB_PATH

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release
